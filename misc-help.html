<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAHARA | Miscellaneous Help</title>
    <link rel="stylesheet" href="misc-help.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <img src="imgages/orange-logo.png" alt="SAHARA Logo">
        </div>
        <div class="profile-btn" onclick="toggleProfile()">👤 Profile</div>
    </header>

    <!-- PROFILE ASIDE -->
    <aside class="profile-aside" id="profileAside">

        <div class="aside-header">
            <span class="close" onclick="toggleProfile()">✕</span>
            <h2>My Profile</h2>
        </div>

        <div class="aside-body">

            <div class="profile-card">
                <p class="name">Ramesh Sharma</p>
                <p class="age">Age: 68</p>
            </div>

            <div class="emergency-card">
                <h3>Emergency Contacts</h3>
                <p>📞 Son – 9876543210</p>
                <p>📞 Daughter – 9123456789</p>
                <p>📞 Neighbor – 9001122334</p>
            </div>

                    <!-- UPDATE BUTTON -->
        <div class="aside-action">
            <button class="update-btn">
                ✏️ Update Details
            </button>
        </div>
        </div>

                <!-- LOGOUT SECTION -->
                <div class="aside-footer">
                    <button class="logout-btn">
                        🚪 Logout
                    </button>
                </div>

    </aside>

    <!-- PAGE TITLE -->
    <section class="page-title">
        <h1>Additional Assistance</h1>
        <p>Support for everyday tasks and special needs</p>
    </section>

    <!-- SERVICES -->
    <section class="services-section">

        <div class="service-grid">

            <button class="service-card">
                🛒
                <span>Grocery Shopping</span>
            </button>

            <button class="service-card">
                💳
                <span>Bill Payments</span>
            </button>

            <button class="service-card">
                📱
                <span>Basic Tech Help</span>
            </button>

            <button class="service-card">
                🧹
                <span>Small Daily Assistance</span>
            </button>

        </div>

        <!-- EMERGENCY -->
        <button class="sos-btn">
            🚨 Emergency SOS
        </button>

    </section>
    <script>
        function toggleProfile() {
            document.getElementById("profileAside").classList.toggle("active");
        }
        
    </script>
</body>

</html>
