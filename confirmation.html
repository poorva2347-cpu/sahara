<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAHARA | Request Confirmed</title>
  <link rel="stylesheet" href="confirmation.css">
</head>
<body>

  <header class="header">
    <div class="logo">
      <img src="imgages/orange-logo.png" alt="SAHARA Logo">
  </div>

    <div class="header-actions">
        <button class="sos-header-btn">🚨 SOS</button>
        <div class="profile-btn" onclick="toggleProfile()">👤 Profile</div>
    </div>
</header>

      <!-- PROFILE ASIDE -->
      <aside class="profile-aside" id="profileAside">

        <div class="aside-header">
            <span class="close" onclick="toggleProfile()">✕</span>
            <h2>My Profile</h2>
        </div>

        <div class="aside-body">

            <div class="profile-card">
                <p class="name">Ramesh Sharma</p>
                <p class="age">Age: 68</p>
            </div>

            <div class="emergency-card">
                <h3>Emergency Contacts</h3>
                <p>📞 Son – 9876543210</p>
                <p>📞 Daughter – 9123456789</p>
                <p>📞 Neighbor – 9001122334</p>
            </div>


            <!-- UPDATE BUTTON -->
            <div class="aside-action">
                <button class="update-btn">
                    ✏️ Update Details
                </button>
            </div>

        </div>

        </div>
        <!-- LOGOUT SECTION -->
        <div class="aside-footer">
            <button class="logout-btn">
                🚪 Logout
            </button>
        </div>


    </aside>

  <!-- CONFIRMATION SECTION -->
  <section class="confirmation-section">
      <div class="confirmation-card">
          <div class="checkmark">✅</div>
          <h1>Request Confirmed!</h1>
          <p>Your request for <strong>Medication Help</strong> has been successfully received.</p>

          <div class="volunteer-info">
              <p>Volunteer Assigned:</p>
              <p class="volunteer-name">Mr. Rajesh Kumar</p>
          </div>

          <button class="dashboard-btn" onclick="goToDashboard()">Back to Dashboard</button>
      </div>
  </section>

  

  <script>
    function toggleProfile() {
        document.getElementById("profileAside").classList.toggle("active");
    }
    function openEmergencyModal() {
            document.getElementById("emergencyModal").classList.add("active");
        }

        function closeEmergencyModal() {
            document.getElementById("emergencyModal").classList.remove("active");
        }

        function addModalContact() {
            const div = document.createElement("div");
            div.className = "contact-row";
            div.innerHTML = `
        <input type="tel" placeholder="Contact number">
        <input type="text" placeholder="Relation">
        <button onclick="removeContact(this)">Remove</button>
    `;
            document.getElementById("modalContacts").appendChild(div);
        }

        function removeContact(btn) {
            btn.parentElement.remove();
        }

        function saveEmergencyContacts() {
            const modalContacts = document.querySelectorAll("#modalContacts .contact-row");
            const emergencyCard = document.querySelector(".emergency-card");

            emergencyCard.innerHTML = "<h3>Emergency Contacts</h3>";

            modalContacts.forEach(row => {
                const phone = row.children[0].value;
                const relation = row.children[1].value;
                emergencyCard.innerHTML += `<p>📞 ${relation} – ${phone}</p>`;
            });

            closeEmergencyModal();
        }
</script>

</body>
</html>
